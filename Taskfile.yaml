version: "3"

vars:
  CLUSTER: try-agent-sandbox-ts

tasks:
  default:
    cmd: task --list

  cluster:create:
    cmds:
      - kind create cluster --name {{ .CLUSTER }} --config kind-config.yaml
      - task: cluster:install-agent-sandbox
      - task: cluster:install-sandbox-template-and-pool

  cluster:delete:
    cmd: kind delete cluster --name {{ .CLUSTER }}

  cluster:install-agent-sandbox:
    env:
      VERSION: v1.0.4
    cmds:
      - kubectl apply -f https://github.com/kubernetes-sigs/agent-sandbox/releases/download/${VERSION}/sandbox-with-extensions.yaml
      # The template/pool can only be applied once their CRDs are served.
      - kubectl wait --for=condition=established --timeout=60s crd/sandboxtemplates.extensions.agents.x-k8s.io crd/sandboxwarmpools.extensions.agents.x-k8s.io crd/sandboxclaims.extensions.agents.x-k8s.io
      - kubectl -n agent-sandbox-system rollout status deployment/agent-sandbox-controller --timeout=120s

  cluster:install-sandbox-template-and-pool:
    deps:
      - docker:build-sandboxd
    cmds:
      - kubectl apply -f manifests/sandbox-template-and-pool.yaml
      - kubectl apply -f manifests/sandbox-template-and-pool-inject.yaml

  # Built from the submodule (not the staging registry) so the daemon always
  # matches the TypeScript SDK. The build context must be the repo root.
  docker:build-sandboxd:
    dir: agent-sandbox
    cmds:
      - docker build -t kind.local/sandboxd:latest -f packages/sandboxd/Dockerfile .
      - kind load docker-image kind.local/sandboxd:latest --name {{ .CLUSTER }}

  build:sandbox-client:
    dir: agent-sandbox/clients/typescript/agentic-sandbox-client
    cmds:
      - npm install

  playground:run:
    deps:
      - build:sandbox-client
    dir: playground
    cmds:
      - npm install
      - npm run dev

  docker:build-sandbox-job:
    cmds:
      - docker build -t sandbox-job:latest -f sandbox-job/Dockerfile .
      - kind load docker-image sandbox-job:latest --name {{ .CLUSTER }}

  job:run:
    deps:
      - docker:build-sandbox-job
    cmds:
      - kubectl delete job sandbox-job --ignore-not-found
      - kubectl apply -f sandbox-job/k8s/job.yaml
      - kubectl wait --for=condition=complete job/sandbox-job --timeout=120s
      - kubectl logs job/sandbox-job

  python-sandbox:run:
    deps:
      - build:sandbox-client
    dir: python-sandbox
    cmds:
      - npm install
      - npm run dev
