apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-job-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-job-role
rules:
  # SandboxClaim CRUD (CLAIM_API_GROUP = "extensions.agents.x-k8s.io")
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Sandbox watch (SANDBOX_API_GROUP = "agents.x-k8s.io") — used to wait for
  # Ready and to read status.serviceFQDN.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  # No pods/portforward: with "in-cluster-service" connectivity the SDK dials
  # sandboxd over the pod network, keeping the apiserver off the data path.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-job-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-job-role
subjects:
  - kind: ServiceAccount
    name: sandbox-job-sa
    namespace: default
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-job
  namespace: default
spec:
  template:
    metadata:
      labels:
        # Admitted to sandboxd's ports by the SandboxTemplate's networkPolicy.
        app: sandbox-job
    spec:
      serviceAccountName: sandbox-job-sa
      restartPolicy: Never
      containers:
        - name: sandbox-job
          image: sandbox-job:latest
          imagePullPolicy: Never
          env:
            - name: WARMPOOL
              value: "sandboxd-warmpool"
            - name: NAMESPACE
              value: "default"
  backoffLimit: 0
